<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Contact Us | Secure Shield Solutions</title>

  <!-- Archivo font (falls back to system fonts if it fails to load) -->
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/main.css">
</head>
<body>

  <!-- ===== Header: logo + main navigation (same on every page) =====
       The link for the page you are on carries aria-current="page",
       which styles.css underlines. -->
  <header>
    <div class="wrap">
      <a class="logo" href="index.html" aria-label="Secure Shield Solutions home">
        <svg viewBox="0 0 32 32" aria-hidden="true">
          <path d="M16 2 4 7v8c0 7 5 12 12 15 7-3 12-8 12-15V7z" fill="var(--brand)"/>
          <path d="M9 21 16 8l7 13h-4l-3-6-3 6z" fill="var(--signal)"/>
        </svg>
        SECURE SHIELD SOLUTIONS
      </a>

      <nav aria-label="Primary">
        <a href="index.html">Home</a>
        <a href="about.html">About Us</a>
        <a href="services.html">Cybersecurity Services</a>
        <a href="incident-response.html">Incident Response</a>
        <a href="training.html">Training &amp; Awareness</a>
        <a href="backup-recovery.html">Backup &amp; Recovery</a>
        <a href="contact.html" aria-current="page">Contact Us</a>
      </nav>
    </div>
  </header>

  <!-- ===== Page content ===== -->
  <main>
    <!-- Contact Us: details on the left, form on the right -->
    <section class="page">
      <div class="wrap contact">
        <div>
          <h2 class="title">Contact Us</h2>
          <dl>
            <dt>Email</dt>
            <dd><a href="mailto:info@example.com">info@example.com</a></dd>
            <dt>Phone</dt>
            <dd><a href="tel:5550102026">(555) 010-2026</a></dd>
          </dl>
        </div>

        <!-- Prototype form: script.js validates it but does not send anything -->
        <form id="contact-form" novalidate>
          <label>Name <input name="name" required autocomplete="name"></label>
          <label>Email <input name="email" type="email" required autocomplete="email"></label>
          <label>Message <textarea name="msg" required></textarea></label>
          <button class="btn" type="submit">Send message</button>
          <p id="status" role="status"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- ===== Footer (same on every page; links are placeholders) ===== -->
  <footer>
    <div class="wrap">
      <span>&copy; 2026 Secure Shield Solutions</span>
      <nav aria-label="Footer">
        <a href="#">Privacy</a>
        <a href="#">Acceptable use</a>
        <a href="#">Security reporting</a>
        <a href="#">Terms</a>
      </nav>
    </div>
  </footer>

  <script src="scripts/script.js"></script>
</body>
</html>
